name: Release
on:
  # push:
  #   tags:
  #     - "*"
  pull_request: # debug
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release-binary:
    strategy:
      fail-fast: false # debug
      matrix:
        include:
          - os: linux
            arch: amd64
            target: x86_64-unknown-linux-gnu
            cc: gcc
          - os: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            cc: aarch64-linux-gnu-gcc
          - os: linux
            arch: arm
            target: armv7-unknown-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
          - os: darwin
            arch: arm64
            target: aarch64-apple-darwin
            cc: clang
          - os: windows
            arch: amd64
            target: x86_64-pc-windows-gnu
            cc: x86_64-w64-mingw32-gcc
    runs-on: ${{ (matrix.os != 'darwin' && 'ubuntu-latest') || 'macos-latest' }}
    env:
      RELEASE_GOOS: ${{ matrix.os }}
      RELEASE_GOARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      CC: ${{ matrix.cc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # --------- setup cross compilers ---------
      - name: Install cross-compilers
        run: |
          if [ "${{ matrix.os }}" == "linux" ]; then
            sudo apt update
            sudo apt-get install gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
          elif [ "${{ matrix.os }}" == "windows" ]; then
            sudo apt update
            sudo apt-get install gcc-mingw-w64-x86-64
          fi
      # --------- setup rust ---------
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: true
          cache-workspaces: ./lib/system
          cache-key: ${{ matrix.target }}
          target: ${{ matrix.target }}
      - name: Setup cross toolchain
        if: matrix.os != 'windows'
        run: cargo install cross
      # --------- setup go ---------
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      # --------- goreleaser ---------
      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          # args: release --clean
          args: build --snapshot --clean # use this for PR workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  attestation:
    runs-on: ubuntu-latest
    needs: release-binary
    steps:
      - name: Set tag name
        id: name
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
      # --------- attestation ---------
      - uses: robinraju/release-downloader@v1
        with:
          tag: ${{ steps.name.outputs.TAG_NAME }}
          fileName: "*"
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: .
